services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-portfolio:latest
    container_name: my-portfolio
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_DATABASE: /var/www/html/storage/app/database/database.sqlite
    volumes:
      - ./.env:/var/www/html/.env:ro
      - portfolio-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  portfolio-storage:
